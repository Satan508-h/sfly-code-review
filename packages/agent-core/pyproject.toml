[project]
name = "sfly-agent"
version = "0.1.0"
description = "LLM 抽象与结构化输出、RAG 检索、聚合算法、GitHub 客户端、LangGraph 状态与节点"
requires-python = ">=3.12"
dependencies = [
    "sfly-shared",
    "sfly-bus",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    # 走 OpenAI 兼容接口，所以同一套客户端能对接 DeepSeek / OpenAI / vLLM。
    # 刻意**不**直接依赖 httpx：openai 3.x 自带的是 httpx2，两套并存在同一个
    # 进程里会得到两份连接池和两种超时语义，而把一方的对象传给另一方不会报错。
    # M7 的 GitHub 客户端再决定用哪个（届时是一处显式选择，而不是默认混着）。
    "openai>=3.19",
    # 去重靠 rapidfuzz 而非 embedding：确定性、可复现、无模型下载、微秒级
    "rapidfuzz>=3.9",
    # RAG v1 用 BM25 而非向量库：60-120 条手写规则上词法检索完全够用
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
    "tenacity>=9.1",
]

[tool.uv.sources]
sfly-shared = { workspace = true }
sfly-bus = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sfly_agent"]

[tool.hatch.build.targets.wheel.force-include]
# 规则库是数据不是代码，但必须随包分发 —— 否则容器里检索不到任何规则
"sfly_agent/rag/corpus" = "sfly_agent/rag/corpus"
