[project]
name = "sfly-shared"
version = "0.1.0"
description = "领域契约、配置、ID、日志、异常 —— 全项目唯一的真相来源"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "python-ulid>=4.0",
    "structlog>=26.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sfly_shared"]
