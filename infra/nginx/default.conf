# 完整模式下前端与后端**同源**：nginx 托管 SPA 静态文件，并把 /api 反代到
# api:8000。这样 SSE 不用处理跨域，也不需要配 CORS。
#
# 精简模式下前端在 Vercel、后端在 Render，那时才需要 CORS —— 由
# CORS_ORIGINS 环境变量控制，见 packages/shared/sfly_shared/config.py。
#
# 路径约定：**后端 API 全部挂在 /api 下**（/api/runs、/api/events/...），
# 而 /healthz 留在根路径给容器健康检查用。
# 这里做的是直通代理（proxy_pass 结尾不带斜杠），不做路径改写 ——
# 于是本地和线上用的是同一套 URL，前端只需要换 VITE_API_BASE 的值。

upstream sfly_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --------------------------------------------------------------------- #
    # API 直通
    # --------------------------------------------------------------------- #
    location /api/ {
        proxy_pass http://sfly_api;          # 无尾斜杠 = 保留 /api 前缀
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # ---- SSE 相关的三行，缺一不可 ----
        # 默认 nginx 会缓冲响应体，EventSource 会一直收不到数据直到连接关闭，
        # 表现为「进度条不动，刷新一下结果全出来了」。
        proxy_buffering off;
        proxy_cache off;
        # 告诉上游不要用任何缓冲（FastAPI 侧会带上 X-Accel-Buffering: no）
        proxy_set_header X-Accel-Buffering no;
        # SSE 是长连接。默认 60s 会被掐断，客户端虽然会自动重连（带
        # Last-Event-ID 补齐缺口），但日志里全是噪音。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 后端健康检查，给容器探针用
    location = /healthz {
        proxy_pass http://sfly_api/healthz;
        access_log off;
    }

    # --------------------------------------------------------------------- #
    # SPA
    # --------------------------------------------------------------------- #
    location / {
        # 前端是 history 路由，/runs/01H... 这类路径要回退到 index.html，
        # 否则刷新页面直接 404。
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 本身绝不能缓存，否则用户拿到的是引用旧 assets 的旧页面
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
