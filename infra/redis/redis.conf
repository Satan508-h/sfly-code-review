# Redis 配置 —— 完整模式专用。
#
# 我们的恢复逻辑（orchestrator 的扫描器按 attempt+1 重派）能兜住 Redis 丢数据，
# 但演示「Redis 重启、任务不丢」时，RDB 快照的默认行为会很难看：
# 快照是分钟级的，重启会丢掉最近一分钟的 stream 条目。
# AOF everysec 把这个窗口压到 1 秒。

# --- 持久化 -----------------------------------------------------------------
appendonly yes
appendfsync everysec
# AOF 重写期间不阻塞写入。重写会 fork 子进程，主进程继续服务。
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# --- 内存 -------------------------------------------------------------------
# noeviction 是刻意的：这是队列，不是缓存。
# 用 allkeys-lru 会在内存压力下**静默丢弃待处理的任务消息**，
# 表现为「有些 PR 就是没被审查」，且没有任何错误日志。
# 宁可写入失败（应用层立刻看到 OOM 错误）也不要静默丢任务。
maxmemory-policy noeviction

# --- 连接 -------------------------------------------------------------------
# 完整模式下最多 7 个容器连进来，加宿主机上的脚本，这个上限很宽松。
maxclients 128
timeout 0
tcp-keepalive 300

# --- 日志 -------------------------------------------------------------------
loglevel notice

# --- 慢查询 ----------------------------------------------------------------
# 10ms 以上的命令记下来。XAUTOCLAIM 扫大 PEL 时这里能看出来。
slowlog-log-slower-than 10000
slowlog-max-len 128
