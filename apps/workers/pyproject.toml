[project]
name = "sfly-workers"
version = "0.1.0"
description = "一套参数化 Worker 代码，三种部署：--spec security|performance|style"
requires-python = ">=3.12"
dependencies = [
    "sfly-shared",
    "sfly-bus",
    "sfly-agent",
]

[tool.uv.sources]
sfly-shared = { workspace = true }
sfly-bus = { workspace = true }
sfly-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sfly_workers"]

[project.scripts]
sfly-worker = "sfly_workers.__main__:main"
