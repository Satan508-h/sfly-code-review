# CI：lint + 单测 + 集成层（对着真 Redis 和真 Postgres 跑）。
#
# 两个 job 的分工是刻意的：
#
# * **check** 不需要任何外部依赖、不需要密钥 —— 这是门槛设计：一个需要外部
#   依赖才能跑的 CI，在被 fork 或在新环境里第一次跑就会红，然后人们就开始
#   忽略它。端到端测试（真实 DeepSeek 密钥，会花钱）仍然留给本地和 M9 的
#   夜间任务。
# * **integration** 起真的 Redis + Postgres，把集成层整个跑一遍。里面有两类东西：
#
#   1. **队列/锁契约**（``-m integration`` 里的 ``test_redis_*``）—— 同一份契约
#      在第二个后端上再跑一遍。这一条不是「多一份测试」：它是项目中心论点
#      （一套代码、两种拓扑）的证据。没有这个 job，那份契约会慢慢退化成
#      「只有内存后端在跑」，而**不会有任何东西报错**：测试全绿、覆盖率不降，
#      只是证据没了。
#   2. **仓储与迁移**（``test_postgres_*``）—— 这些没有第二个实现可比，
#      所以不是契约（理由写在那个文件的文档字符串里）。它们需要的是一个
#      **真的** Postgres：空库上建表、五个进程并发迁移、失败回滚、
#      jsonb 往返。拿假对象测这些等于测了个寂寞。
#   3. **整张图**（``orchestrator/test_graph_end_to_end.py``）—— 真 Redis + 真
#      Postgres + 真 checkpointer。``interrupt()`` 的挂起与恢复、屏障靠一次
#      数据库查询闭合、扫描器救一个没人叫的 run，这三件事**只有在这种环境里
#      才验证得了**：内存里的假 checkpointer 测不出序列化和恢复的语义，
#      而那正是这一层要买的东西。
#   4. **webhook 入口**（``api/test_webhook_dedup.py``）—— 真 Postgres + 真 Redis。
#      单测那一层用的是手写的假仓储，所以「``delivery_id`` 的主键约束真的存在」
#      和「三次投递真的只在流上留下一条消息」只有这里验证得了：迁移文件写错
#      一个字母，单测全绿。并发投同一个 delivery id 的那条也是在这里才发现
#      5 个请求投出了 5 条 bootstrap。
#
#   testcontainers 用不上（CI 里没有 Docker daemon 可用），所以用 service container。
#
# 命令与本地完全一致（见 Makefile / tasks.py），所以「本地过了 CI 挂了」
# 这种事不会发生。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时取消上一次未完成的运行，省 CI 额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI 里不需要 uv 去下载 Python，直接用 runner 自带的
  UV_PYTHON_DOWNLOADS: "never"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 按 lock 文件同步依赖
        # --frozen：lock 与 pyproject 不一致时直接失败，而不是静默重新解析。
        # 这正是我们想要的 —— 改了 pyproject 却忘了提交 uv.lock 应该在 CI 里暴露。
        run: uv sync --frozen --all-packages

      - name: Lint（ruff check + format）
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: 类型检查（mypy strict）
        # CLAUDE.md 里写着「mypy 在 CI 中跑」，这个步骤是让那句话成立的那一步。
        # 声明了却在别处不执行的门槛，比没有门槛更糟：它会让人以为有保护。
        # scripts/ 也在内：它是交付物的一部分（replay_webhook.py 是 M6 的验收工具），
        # 而「没被任何东西检查的代码」正是最容易长歪的那种。
        run: uv run mypy packages apps tests scripts

      - name: 单测
        # 默认 addopts 已排除 integration / e2e 标记，所以不需要额外参数
        run: uv run pytest

      - name: 校验 docker-compose 可解析
        # 构建整栈太重，但配置文件语法错误应该在 CI 里就拦住 ——
        # 这类错误只会在别人 clone 下来跑 `docker compose up` 时才暴露。
        run: docker compose config --quiet

  integration:
    # 集成层：队列/锁契约（真 Redis）+ 仓储与迁移（真 Postgres）。
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      redis:
        image: redis:7-alpine
        # 起 redis-server 自己；健康检查等 PING 通 —— 不等的话测试会撞上
        # 一个还没起来的实例，然后报出一个看起来像代码问题的连接错误。
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 6379:6379

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sfly
          POSTGRES_PASSWORD: sfly
          POSTGRES_DB: sfly
        # pg_isready 要带 -U：不带的话它探的是「这台机器上有没有 postgres」，
        # 而不是「我这个用户能不能连上」—— 后者才是测试要等的那个条件。
        options: >-
          --health-cmd "pg_isready -U sfly -d sfly"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 按 lock 文件同步依赖
        run: uv sync --frozen --all-packages

      - name: 集成测试（真 Redis + 真 Postgres）
        # 两个 URL 都指向 service container。
        #
        # Redis：测试自己会用 db 15，并且**只在确认库号是 15 时**才 flushdb
        # （见 tests/redis_support.py）。
        # Postgres：测试会**另建一个 sfly_test 库**并在会话开始时删掉重建
        # （见 tests/postgres_support.py）—— 所以这里给的 sfly 库不会被弄脏，
        # 而每一次 run 都是在空库上验证「migrate() 能不能建起来」。
        env:
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql://sfly:sfly@localhost:5432/sfly
        run: uv run pytest -m integration -o addopts="-q --strict-markers -ra"
