# uv workspace 根。本身不是一个包（package = false），只是把 apps/* 和
# packages/* 串成一个依赖图，共用一份 uv.lock。
#
# 开发时：uv sync                      → 装齐所有成员 + dev 依赖
# 构建时：uv sync --package sfly-api   → 只装该服务的依赖闭包（镜像更小）

[project]
name = "sfly-workspace"
version = "0.1.0"
description = "基于多 Agent 的分布式代码审查系统"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-recording>=0.13",
    "fakeredis>=2.38",
    "testcontainers[postgres,redis]>=4.15",
    "mypy>=1.14",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: 无 Docker、无密钥，< 10s",
    "integration: 需要 Docker（testcontainers 或 compose 栈），用 Mock LLM",
    "eval: 评测集（离线层用 Mock，真实层要密钥；`python tasks.py eval`）",
    "e2e: 需要真实 DeepSeek 密钥 + 真实 GitHub，手动/夜间跑，有花费上限",
]
# 默认只跑单测。integration/e2e 必须显式 -m 选择 —— 这样 `pytest` 在
# 一台没装 Docker 的机器上也能绿。
addopts = "-q --strict-markers -m 'not integration and not e2e'"

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["apps", "packages", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "E501",    # 行长交给 formatter
    "S101",    # assert 在测试里是正常的
    "B008",    # FastAPI 的 Depends() 就是默认参数
    # 本项目的注释和文档字符串是中文，全角标点（，：（））是正确写法而非笔误。
    # 这三条规则是给纯 ASCII 代码库设计的，在这里只会产生 480+ 条噪音，
    # 把真正的问题淹没掉。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
# 不声明的话 ruff 会把 sfly_shared / sfly_workers / sfly_bus 当成互不相干的
# 第三方包，在它们之间插空行 —— 它们其实都是本仓库的 workspace 成员。
known-first-party = [
    "sfly_shared",
    "sfly_bus",
    "sfly_agent",
    "sfly_api",
    "sfly_orchestrator",
    "sfly_workers",
    "sfly_lite",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/shared:packages/bus:packages/agent-core:apps/api:apps/orchestrator:apps/workers:apps/lite"

[[tool.mypy.overrides]]
# PyYAML 其实有第三方 stubs（types-PyYAML），但 safe_load 的返回类型
# 本来就是 Any —— 装上它只换来 import 不再报错，多一个依赖不值得。
# 与之相对，rank_bm25 / ulid 确实没有可用的 stubs。
module = ["rank_bm25.*", "ulid.*", "testcontainers.*", "yaml.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["packages", "apps"]
branch = true
